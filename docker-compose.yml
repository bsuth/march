services:
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile.dev
    ports: [ 8000:8000 ]
    volumes:
      - .:/march
      - server_build:/march/server/build
      - server_dets:/march/server/dets

  web:
    image: ghcr.io/gleam-lang/gleam:nightly-erlang
    command: gleam run -m lustre/dev start
    ports: [ 1234:1234 ]
    volumes:
      - .:/march
      - web_build:/march/web/build
    working_dir: /march/web

volumes:
  server_build:
  server_dets:
  web_build:
