services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: march
      POSTGRES_PASSWORD: march
      POSTGRES_DB: march
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U march"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports: [ 5432:5432 ]
    volumes: [ postgres_data:/var/lib/postgresql ]

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile.dev
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://march:march@postgres:5432/march
    ports: [ 8000:8000 ]
    volumes:
      - .:/march
      - server_build:/march/server/build

  web:
    image: ghcr.io/gleam-lang/gleam:nightly-erlang
    command: gleam run -m lustre/dev start
    ports: [ 1234:1234 ]
    volumes:
      - .:/march
      - web_build:/march/web/build
    working_dir: /march/web

volumes:
  postgres_data:
  server_build:
  web_build:
